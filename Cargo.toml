[workspace]
resolver = "3"
members = ["slipstream", "slipstream-config", "slipstream-settings"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/peterwalker78/slipstream-desktop"
rust-version = "1.85"

[workspace.dependencies]
# Pinned: crates.io's last release (0.7.0) is from June 2025. Upgrade on purpose, between phases.
smithay = { git = "https://github.com/Smithay/smithay", rev = "0ff00983b6007257a7a161a4fe8b14a778e2ac8f", default-features = false }
# Connector scanning and EDID names, from the same Smithay commit.
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "0ff00983b6007257a7a161a4fe8b14a778e2ac8f" }
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
png = "0.18"
xcursor = "0.3.3"
# The bar and overlays: text in the mockup's fonts, and its SVG icons (no text or system fonts in
# resvg itself, which keeps the build small).
fontdue = "0.9"
# Glyphs from installed fonts for characters the embedded ones lack, read without parsing a whole
# face (fontdue already depends on this version).
ttf-parser = { version = "0.25", default-features = false, features = ["std", "variable-fonts"] }
resvg = { version = "0.48", default-features = false }
# D-Bus in pure Rust: the compositor serves org.freedesktop.Notifications in its session.
zbus = "5.19"
# Clearing the signal mask in children (`launch::command`).
libc = "0.2"
# The settings file, shared by the compositor and slipstream-settings.
slipstream-config = { path = "slipstream-config" }
serde = { version = "1", features = ["derive"] }
# The lock screen's password is wiped from memory whenever it is let go.
zeroize = "1"
toml = "1.1"
# slipstream-settings: GTK4, the plan's toolkit for Slipstream's own apps (AT-SPI accessibility).
# Pango 1.56 loads the mockup's fonts from files without installing them.
gtk4 = { version = "0.11", features = ["v4_14"] }
pango = { version = "0.22", features = ["v1_56"] }

# Dev builds keep debug info small (less RAM and disk while linking)
# but optimise dependencies, so rendering in the nested window isn't painfully slow.
[profile.dev]
debug = "line-tables-only"

# Release packages are built by CI (.github/workflows/release.yml), not on a laptop.
[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2

# The compositor's own code gets a little optimisation too: the code rain draws per pixel.
[profile.dev.package.slipstream]
opt-level = 1
