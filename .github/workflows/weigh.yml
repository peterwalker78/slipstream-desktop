name: weigh

# Installs the newest release and seven other desktops, each complete and each on the same Arch
# Linux system, and counts what each one added: packages, and space on disk. Run by hand before a
# release; the figures go into slipstream-config/src/weight.rs.
on:
  workflow_dispatch:
    inputs:
      desktops:
        description: Which desktops, as a JSON list
        default: '["slipstream", "gnome", "plasma", "xfce", "cosmic", "niri", "sway", "hyprland"]'

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(inputs.desktops) }}
    runs-on: ubuntu-latest
    container: docker.io/library/archlinux:latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ${{ matrix.desktop }} and weigh it
        run: sh scripts/weigh-install ${{ matrix.desktop }} | tee weight-${{ matrix.desktop }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: weight-${{ matrix.desktop }}
          path: weight-${{ matrix.desktop }}.txt

  session:
    strategy:
      fail-fast: false
      matrix:
        desktop: ${{ fromJSON(inputs.desktops) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Let QEMU use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils socat >/dev/null

      - name: Start ${{ matrix.desktop }} and weigh it
        run: |
          WEIGH_DIR=$PWD/vm sh scripts/weigh-session ${{ matrix.desktop }} \
            | tee session-${{ matrix.desktop }}.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-${{ matrix.desktop }}
          path: |
            session-${{ matrix.desktop }}.txt
            vm/session-${{ matrix.desktop }}.ppm

  table:
    needs: [install, session]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          merge-multiple: true

      - name: Put them in one table
        run: |
          cat weight-*.txt | sort >installs
          cat session-*.txt 2>/dev/null | sort >sessions
          {
            echo "| Desktop | Packages added | MB on disk | MB of memory | % of a processor at rest |"
            echo "|---|---:|---:|---:|---:|"
            join -a1 -e - -o 0,1.2,1.3,2.2,2.3 installs sessions | sort -k3 -n \
              | awk '{ printf "| %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, $5 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"
