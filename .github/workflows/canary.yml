name: canary

# Once a week: installs the newest release on the distributions that keep moving, checks that
# every distribution package still builds on the openSUSE Build Service, and checks the crates
# against the RustSec advisories, so that a change elsewhere shows up here rather than in
# somebody's first login or update.
# GitHub stops scheduled runs after 60 days without a commit; a push starts them again.
on:
  schedule:
    - cron: "19 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distributions:
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/debian:testing
          - docker.io/library/ubuntu:rolling
          - registry.fedoraproject.org/fedora:rawhide
          - docker.io/library/archlinux:latest
          - registry.opensuse.org/opensuse/tumbleweed:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      # So that asking GitHub which release is newest isn't rate-limited alongside every other job.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the newest release and check it runs
        run: sh scripts/test-on-distro --release latest

  # Rolling distributions change under the packages daily, and a failed rebuild means people stop
  # getting updates without being told.
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Every distribution package still builds
        run: |
          curl -fsS "https://api.opensuse.org/public/build/home:peterwalker78/_result?package=slipstream-desktop" >results.xml
          cat results.xml
          if grep -E 'code="(failed|unresolvable|broken)"' results.xml; then
            echo "At least one distribution package no longer builds on the openSUSE Build Service." >&2
            exit 1
          fi

  # The source the packages are built from carries every crate, so a crate with a known hole ships.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the crates against the RustSec advisories
        run: |
          cargo install cargo-audit --locked
          cargo audit

  # One issue for a week's failures, and a comment on it if it's still open next week.
  report:
    needs: [distributions, packages, advisories]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Say so in an issue
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label canary --state open \
            --limit 1 --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still failing this week: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label canary \
              --title "The weekly check failed" \
              --body "At least one of the weekly checks failed: the newest release installing on a
          distribution that keeps moving, a distribution package building on the openSUSE Build
          Service, or a crate with a RustSec advisory.

          Which one, and why, is in the run: $RUN

          This is usually a change elsewhere, in a distribution or a crate, rather than a change here."
          fi
