name: build

# Private repos get limited free CI minutes, so this runs on pushes to main
# and on demand only, and cancels superseded runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain and libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc clang mold rustup pkgconf-pkg-config \
            libxkbcommon-devel wayland-devel systemd-devel libinput-devel mesa-libgbm-devel \
            libseat-devel libdrm-devel mesa-libEGL-devel pixman-devel libdisplay-info-devel gtk4-devel \
            ShellCheck dash
          rustup-init -y --profile minimal -c rustfmt -c clippy

      - uses: actions/checkout@v7

      - name: Scripts
        run: |
          shellcheck -s sh scripts/install-session scripts/update-session scripts/package-release \
            scripts/test-install-session scripts/install-extras scripts/test-install-extras \
            session/slipstream-session
          shellcheck scripts/nested scripts/stubborn
          scripts/test-install-session
          SHELL_UNDER_TEST=dash scripts/test-install-session
          scripts/test-install-extras
          SHELL_UNDER_TEST=dash scripts/test-install-extras

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fedora44-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora44-

      - name: Format
        run: . ~/.cargo/env && cargo fmt --all --check

      - name: Clippy
        run: . ~/.cargo/env && cargo clippy --workspace --locked -- -D warnings

      - name: Test
        run: . ~/.cargo/env && cargo test --workspace --locked

  # Release downloads are built here too, so a change that doesn't build on Ubuntu's libraries shows
  # up on the push rather than on release day.
  ubuntu:
    runs-on: ubuntu-latest
    container: docker.io/library/ubuntu:26.04
    steps:
      - name: Install toolchain and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git build-essential clang mold \
            pkg-config rustup libxkbcommon-dev libwayland-dev libsystemd-dev libudev-dev libinput-dev \
            libgbm-dev libseat-dev libdrm-dev libegl-dev libpixman-1-dev libdisplay-info-dev \
            libgtk-4-dev
          rustup set profile minimal

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ubuntu26.04-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ubuntu26.04-

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
