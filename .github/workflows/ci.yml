name: build

# Runs on every push and on demand; superseded runs are cancelled. Public repositories get
# runners for nothing, so there's no reason to be sparing with it.
on:
  push:
    # Every branch; tags are the release workflow's job.
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain and libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc clang mold rustup pkgconf-pkg-config \
            libxkbcommon-devel wayland-devel systemd-devel libinput-devel mesa-libgbm-devel \
            libseat-devel libdrm-devel mesa-libEGL-devel pixman-devel libdisplay-info-devel gtk4-devel \
            ShellCheck dash
          rustup-init -y --profile minimal -c rustfmt -c clippy

      - uses: actions/checkout@v7

      - name: Scripts
        run: |
          shellcheck -s sh scripts/install-session scripts/update-session scripts/package-release \
            scripts/test-install-session scripts/install-extras scripts/test-install-extras \
            scripts/build-portable scripts/check-portable scripts/try-slipstream \
            scripts/test-on-distro install.sh session/slipstream-session
          shellcheck scripts/nested scripts/stubborn
          scripts/test-install-session
          SHELL_UNDER_TEST=dash scripts/test-install-session
          scripts/test-install-extras
          SHELL_UNDER_TEST=dash scripts/test-install-extras

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fedora44-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-fedora44-

      - name: Format
        run: . ~/.cargo/env && cargo fmt --all --check

      - name: Clippy
        run: . ~/.cargo/env && cargo clippy --workspace --locked -- -D warnings

      - name: Test
        run: . ~/.cargo/env && cargo test --workspace --locked

  # The download is built on the oldest system it supports, so that a change which breaks that
  # build shows up on the push rather than on release day.
  portable:
    runs-on: ubuntu-latest
    container: docker.io/library/debian:13
    steps:
      - name: Install toolchain and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang \
            mold pkg-config meson ninja-build hwdata libxkbcommon-dev libwayland-dev libsystemd-dev \
            libudev-dev libinput-dev libgbm-dev libseat-dev libdrm-dev libegl-dev libpixman-1-dev \
            libgtk-4-dev
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-debian13-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-debian13-

      - name: Build the way the download is built
        run: scripts/build-portable

      - name: Test
        run: scripts/build-portable --test
