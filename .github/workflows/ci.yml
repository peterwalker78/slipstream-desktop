name: build

# Runs on every push and on demand; superseded runs are cancelled. Public repositories get
# runners for nothing, so there's no reason to be sparing with it.
on:
  push:
    # Every branch; tags are the release workflow's job.
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Incremental data is only of use to a build that runs again in the same place, and it would fill
# the cached target folder, and the runner's disk with it.
env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
      # The plugin sandbox tests run bubblewrap, which makes namespaces and mounts /proc: what
      # Docker's seccomp and AppArmor profiles and its masked /proc paths otherwise refuse.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install toolchain and libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc clang mold rustup pkgconf-pkg-config \
            libxkbcommon-devel wayland-devel systemd-devel libinput-devel mesa-libgbm-devel \
            libseat-devel libdrm-devel mesa-libEGL-devel pixman-devel libdisplay-info-devel gtk4-devel \
            ShellCheck dash openssh-clients bubblewrap keyutils
          rustup-init -y --profile minimal -c rustfmt -c clippy

      - uses: actions/checkout@v7

      - name: Scripts
        run: |
          shellcheck -s sh scripts/install-session scripts/update-session scripts/package-release \
            scripts/crate-licences \
            scripts/test-install-session scripts/install-extras scripts/test-install-extras \
            scripts/test-install-sh \
            scripts/build-portable scripts/check-portable scripts/try-slipstream \
            scripts/test-on-distro scripts/stubborn scripts/nested install.sh \
            session/slipstream-session
          scripts/test-install-session
          SHELL_UNDER_TEST=dash scripts/test-install-session
          scripts/test-install-extras
          SHELL_UNDER_TEST=dash scripts/test-install-extras
          scripts/test-install-sh
          SHELL_UNDER_TEST=dash scripts/test-install-sh

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: registry-fedora44-${{ hashFiles('Cargo.lock') }}
          restore-keys: registry-fedora44-

      # Only ever for the same Cargo.lock: cargo never clears out what an older one built, so a
      # target folder carried over from one lock to the next only grows.
      - uses: actions/cache@v6
        with:
          path: target
          key: target-fedora44-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: . ~/.cargo/env && cargo fmt --all --check

      - name: Clippy
        run: . ~/.cargo/env && cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: . ~/.cargo/env && cargo test --workspace --locked

  # The download is built on the oldest system it supports, so that a change which breaks that
  # build shows up on the push rather than on release day.
  portable:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/debian:13
      # As above, for the plugin sandbox tests.
      options: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - name: Install toolchain and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang \
            mold pkg-config meson ninja-build hwdata libxkbcommon-dev libwayland-dev libsystemd-dev \
            libudev-dev libinput-dev libgbm-dev libseat-dev libdrm-dev libegl-dev libpixman-1-dev \
            libgtk-4-dev bubblewrap keyutils
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: registry-debian13-${{ hashFiles('Cargo.lock') }}
          restore-keys: registry-debian13-

      # Only ever for the same Cargo.lock: cargo never clears out what an older one built, so a
      # target folder carried over from one lock to the next only grows.
      - uses: actions/cache@v6
        with:
          path: target
          key: target-debian13-${{ hashFiles('Cargo.lock') }}

      - name: Build the way the download is built
        run: scripts/build-portable

      - name: Test
        run: scripts/build-portable --test

      - name: Gather the crates' licences, as the download does
        run: |
          scripts/crate-licences target/portable/rust-crates.txt
          grep -q '^smithay ' target/portable/rust-crates.txt
