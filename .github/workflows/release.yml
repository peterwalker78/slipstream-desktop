name: release

# For a version tag: builds the one download that runs on any current distribution, attaches it to
# the tag's GitHub release (made from CHANGELOG.md if it isn't there yet), then installs that
# download in a container of each distribution to check it works there.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build, such as v0.0.2
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    # The oldest system the download supports: its libraries are old enough for newer ones too.
    container: docker.io/library/debian:13
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install toolchain and libraries
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang \
            mold pkg-config meson ninja-build hwdata libxkbcommon-dev libwayland-dev libsystemd-dev \
            libudev-dev libinput-dev libgbm-dev libseat-dev libdrm-dev libegl-dev libpixman-1-dev \
            libgtk-4-dev gh tar gzip
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Build
        run: scripts/build-portable --release

      - name: Pack
        run: |
          scripts/package-release dist
          ls dist/*-linux-*.tar.gz

      - name: Say where it was built, verifiably
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Attach to the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            version=${TAG#v}
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## / { exit }
              on { print }' CHANGELOG.md >notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "Slipstream $version beta" --notes-file notes.md \
              || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          # One file at a time, and a file already on the release is left alone rather than
          # replaced. `--clobber` is meant to replace one and does not reliably: uploading over
          # an asset that is there answers 422, which failed the job and meant a release that
          # got as far as uploading could never be re-run. Deleting first doesn't help either —
          # GitHub can go on reporting an asset that has just been removed. What matters is that
          # the file ends up on the release, so "it is already there" is success, not failure.
          for file in dist/*.tar.gz dist/*.sha256; do
            name=$(basename "$file")
            if out=$(gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$file" 2>&1); then
              echo "uploaded $name"
            elif printf '%s' "$out" | grep -q "already exists"; then
              echo "$name is already on the release"
            else
              printf '%s\n' "$out" >&2
              exit 1
            fi
          done

  # Install what was just published on each distribution, as a person would.
  distributions:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        image:
          - docker.io/library/debian:13
          - docker.io/library/ubuntu:26.04
          - registry.fedoraproject.org/fedora:43
          - registry.fedoraproject.org/fedora:44
          - docker.io/library/archlinux:latest
          - registry.opensuse.org/opensuse/tumbleweed:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Install it and check it runs
        run: sh scripts/test-on-distro --release "$TAG"
