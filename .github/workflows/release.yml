name: release

# For a version tag: builds the programs on Fedora 44 and attaches them, packed with the scripts
# that install them, to the tag's GitHub release (made from CHANGELOG.md if it isn't there yet).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The version tag to build, such as v0.0.2
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:44
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install toolchain and libraries
        run: |
          dnf install -y --setopt=install_weak_deps=False git gcc clang mold rustup pkgconf-pkg-config \
            libxkbcommon-devel wayland-devel systemd-devel libinput-devel mesa-libgbm-devel \
            libseat-devel libdrm-devel mesa-libEGL-devel pixman-devel libdisplay-info-devel gtk4-devel \
            gh tar gzip
          rustup-init -y --profile minimal

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: The tag matches the version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match version $version in Cargo.toml" >&2
            exit 1
          fi

      - name: Build
        run: . ~/.cargo/env && cargo build --release --locked -p slipstream -p slipstream-settings

      - name: Pack
        run: scripts/package-release dist

      - name: Attach to the release
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            version=${TAG#v}
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## / { exit }
              on { print }' CHANGELOG.md >notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "Slipstream $version beta" --notes-file notes.md
          fi
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz dist/*.sha256
