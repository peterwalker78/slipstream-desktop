# xdg-desktop-portal-wlr's settings under Slipstream. scripts/update-session installs this as
# ~/.config/xdg-desktop-portal-wlr/Slipstream, with @SLIPSTREAM@ replaced by the installed binary;
# the portal reads the file named after XDG_CURRENT_DESKTOP, so other desktops never see it.
[screencast]
# Slipstream's own picker. The portal passes it the screens and windows the app will accept on
# standard input and shares the line it prints back, or nothing. Without a chooser named here the
# portal tries slurp (which can't run without a layer shell) and then shares a screen without
# asking anyone.
chooser_type=dmenu
chooser_cmd=@SLIPSTREAM@ --choose-share
# A laptop: 30 frames a second is plenty for a call, and half the copying of 60.
max_fps=30
