# Which portal backend answers which interface under Slipstream. xdg-desktop-portal reads this as
# `slipstream-portals.conf`, because XDG_CURRENT_DESKTOP is Slipstream.
#
# A `default=` line naming the backends installed on the machine is added to the end of this file
# when Slipstream is installed: Slipstream is its own desktop, so no other desktop's
# configuration is consulted, and without a default the interfaces below would be the only ones
# answered at all.
[preferred]
# Dark or light comes from Slipstream's own settings, which nothing else on the machine knows
# about (slipstream.portal names the backend). The rest of that interface -- the accent colour,
# fonts, contrast -- falls through to whatever else is installed, which is where it came from
# before.
org.freedesktop.impl.portal.Settings=slipstream;*
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# xdg-desktop-portal-wlr implements no remote desktop. `none` answers immediately, so apps are
# told there is none rather than being handed KDE's, which would control a desktop that isn't
# running.
org.freedesktop.impl.portal.RemoteDesktop=none
