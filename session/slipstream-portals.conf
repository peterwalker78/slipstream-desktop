# Which portal backend answers which interface under Slipstream. xdg-desktop-portal reads this as
# `slipstream-portals.conf` because XDG_CURRENT_DESKTOP starts with Slipstream.
# scripts/update-session installs it in ~/.config/xdg-desktop-portal, the first place looked.
#
# There is deliberately no `default=` key. Every file that matches is consulted in turn for each
# interface — the named key first, then that file's default — so a default here would answer for
# every interface and the desktop's own kde-portals.conf would never be reached, quietly taking
# its Settings, Secret and Notification routing with it.
[preferred]
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
# xdg-desktop-portal-wlr implements no remote desktop. `none` answers immediately, so apps are
# told there is none rather than being handed KDE's, which would control a desktop that isn't
# running.
org.freedesktop.impl.portal.RemoteDesktop=none
