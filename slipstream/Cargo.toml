[package]
name = "slipstream"
description = "The Slipstream Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Smithay's own calloop, with the signals source turned on: the session teardown has to run on
# SIGTERM too, and a signalfd through the event loop is the only way to do that safely.
calloop = { version = "0.14", features = ["signals"] }
tracing.workspace = true
tracing-subscriber.workspace = true
bitflags.workspace = true
fontdue.workspace = true
libc.workspace = true
png.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
slipstream-config.workspace = true
smithay-drm-extras.workspace = true
toml.workspace = true
ttf-parser.workspace = true
xcursor.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dependencies.smithay]
workspace = true
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    # Real hardware: KMS screens, GBM buffers, libinput, udev hotplug and libseat sessions.
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    # X11 apps through XWayland.
    "xwayland",
]
