# Wisp, the web browser that comes with Slipstream: https://github.com/peterwalker78/wisp
# Installed from its latest release, checked against the release's SHA-256, and updated whenever a
# new release comes out. To leave it out, put a line saying install=no in
# ~/.config/slipstream/extras/wisp.conf.
app_id=io.github.peterwalker78.Wisp
bundle_url=https://github.com/peterwalker78/wisp/releases/latest/download/wisp-x86_64.flatpak
bundle_sha256_url=https://github.com/peterwalker78/wisp/releases/latest/download/wisp-x86_64.flatpak.sha256
