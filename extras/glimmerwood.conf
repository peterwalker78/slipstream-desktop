# Glimmerwood, the web browser that comes with Slipstream: https://github.com/peterwalker78/glimmerwood
# Installed from its latest release, checked against the release's SHA-256, and updated whenever a
# new release comes out. To leave it out, put a line saying install=no in
# ~/.config/slipstream/extras/glimmerwood.conf.
app_id=io.github.peterwalker78.Glimmerwood
bundle_url=https://github.com/peterwalker78/glimmerwood/releases/latest/download/glimmerwood-x86_64.flatpak
bundle_sha256_url=https://github.com/peterwalker78/glimmerwood/releases/latest/download/glimmerwood-x86_64.flatpak.sha256
