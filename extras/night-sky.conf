# Night Sky, the stargazing game that comes with Slipstream: https://github.com/peterwalker78/night-sky
# Installed from its latest release, checked against the release's SHA-256, and updated whenever a
# new release comes out. To leave it out, put a line saying install=no in
# ~/.config/slipstream/extras/night-sky.conf.
app_id=io.github.peterwalker78.NightSky
bundle_url=https://github.com/peterwalker78/night-sky/releases/latest/download/night-sky-x86_64.flatpak
bundle_sha256_url=https://github.com/peterwalker78/night-sky/releases/latest/download/night-sky-x86_64.flatpak.sha256
