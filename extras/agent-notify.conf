# agent-notify, the plugin for people who run AI coding agents in a terminal: https://github.com/peterwalker78/agent-notify
# On its own it does nothing; it needs an agent of your own, whose hooks it is wired into. Installed
# from its latest release, checked against the release's SHA-256 and signature, and updated whenever a new release
# comes out. The installer asks before adding it; to leave it out later, put a line saying
# install=no in ~/.config/slipstream/extras/agent-notify.conf.
plugin=agent-notify
bundle_url=https://github.com/peterwalker78/agent-notify/releases/latest/download/agent-notify-x86_64.tar.gz
bundle_sha256_url=https://github.com/peterwalker78/agent-notify/releases/latest/download/agent-notify-x86_64.tar.gz.sha256
bundle_signer=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIY4lsC3AXYOPqPA+ThsQHQJqVlv1WvRQDesbyTGWfhf slipstream-extra-agent-notify
commands=bin/agent-notify
then=Then run agent-notify setup to wire it into your agents' hooks.
about=agent-notify, notifications, session traces and plan limits for AI coding agents you run in a terminal (it does nothing without one): https://github.com/peterwalker78/agent-notify
